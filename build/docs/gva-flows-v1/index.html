      and who ends up <em>receiving</em> it? Each experiment changes one thing at t = 5 and shows the answer both as official statistics would see it and
      as the true flows behind them.</p></section> <section class="card svelte-1ksr08k"><h2>The views</h2> <dl><dt class="svelte-1ksr08k">Places</dt><dd class="svelte-1ksr08k">One measure ("lens") for each place, with flows of one kind between places: commuters, wages, dividends, purchases, royalties, taxes, benefits. Click a place to follow it in the other views.</dd> <dt class="svelte-1ksr08k">Over time</dt><dd class="svelte-1ksr08k">The scenario (dark line) against the baseline (grey), for the economy and for the selected place, in levels or as the difference.</dd> <dt class="svelte-1ksr08k">Value capture</dt><dd class="svelte-1ksr08k">Who gets each £1 of a final product, following its whole supply chain at home and abroad; and output per worker along the whole chain, next to GVA per job on site.</dd> <dt class="svelte-1ksr08k">Producer</dt><dd class="svelte-1ksr08k">The two-dimensional view of a single producer from Webber &amp; Huaccha (2024): price S, bought-in cost C and quantity Q, with curves of equal GVA (isoGVA).</dd> <dt class="svelte-1ksr08k">Scenario editor</dt><dd class="svelte-1ksr08k">Change any of the spec's switches (§14) from any period, run it, and share it as a link or a JSON file.</dd></dl></section> <section class="card svelte-1ksr08k"><h2>Official statistics and true flows</h2> <table class="data"><thead><tr><th class="svelte-1ksr08k"></th><th class="svelte-1ksr08k">Official statistics</th><th class="svelte-1ksr08k">True flows</th></tr></thead><tbody><tr><td class="svelte-1ksr08k">Where GVA is booked</td><td class="svelte-1ksr08k">Workplace GVA, multi-place firms' profit shared by wage bill (as ONS does in finance and insurance; stylised elsewhere)</td><td class="svelte-1ksr08k">Where it is produced, at head office, or by wage bill</td></tr><tr><td class="svelte-1ksr08k">Real output</td><td class="svelte-1ksr08k">Sector price deflators; public services by output indicators</td><td class="svelte-1ksr08k">Also own base prices (close to physical output) and public services by inputs</td></tr><tr><td class="svelte-1ksr08k">Incomes</td><td class="svelte-1ksr08k">Household disposable income by residence</td><td class="svelte-1ksr08k">Also residual income after essentials, wealth, local retention</td></tr><tr><td class="svelte-1ksr08k">Between places</td><td class="svelte-1ksr08k">Not shown</td><td class="svelte-1ksr08k">Commuting, wages, dividends, trade, royalties, taxes and benefits</td></tr><tr><td class="svelte-1ksr08k">Products</td><td class="svelte-1ksr08k">Not shown</td><td class="svelte-1ksr08k">Value capture along whole supply chains</td></tr><tr><td class="svelte-1ksr08k">One producer</td><td class="svelte-1ksr08k">Turnover, purchases, GVA and S/C only</td><td class="svelte-1ksr08k">S, C and Q separately</td></tr></tbody></table></section> <section class="card svelte-1ksr08k"><h2>Reading the numbers</h2> <ul class="svelte-1ksr08k"><li class="svelte-1ksr08k">Money is £ a year. Output is measured in "£1 at base-year prices", so every price starts at 1.</li> <li class="svelte-1ksr08k">The base year (t = 0) is calibrated: exports balance the current account, the tax rate gives 5% unemployment, and the city's size means
