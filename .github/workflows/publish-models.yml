# Publishes the live models to GitHub Pages.
#
# Why a workflow: this repository holds the whole project, the research and the build, and the
# built models are in build/docs/. GitHub Pages' "Deploy from a branch" setting can serve only
# the repository root or a top-level /docs folder, so it can't point at build/docs. A workflow
# can publish any folder. In the repository's Settings > Pages, set Source to "GitHub Actions".
#
# It publishes build/docs exactly as committed, and builds and runs nothing from the project.
# After changing a model, rebuild it in the build container (npm run build:web), then review and
# commit build/docs; the push publishes it. This file sits outside build/, so the build agent
# can't change what runs here with permission to publish.

name: Publish live models

on:
  push:
    branches: [master]
    paths:
      - 'build/docs/**'
      - '.github/workflows/publish-models.yml'
  # Lets you run it by hand from the Actions tab, e.g. for a first test.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Each action is pinned to a commit, so a tag moved later can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the site is complete
        run: |
          test -f build/docs/index.html || { echo "::error::build/docs/index.html (the landing page) is missing"; exit 1; }
          # The upload follows symbolic links, so one could publish files from elsewhere in the repository.
          if find build/docs -type l | grep -q .; then
            echo "::error::build/docs contains symbolic links, and the upload would publish what they point to. List them with: find build/docs -type l"
            exit 1
          fi
          found=0
          for model in build/docs/*/; do
            test -f "${model}index.html" || { echo "::error::${model}index.html is missing: rebuild it in the build container (npm run build:web) and commit build/docs"; exit 1; }
            echo "Publishing ${model}"
            found=$((found + 1))
          done
          test "$found" -gt 0 || { echo "::error::build/docs has no model folders"; exit 1; }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
